# 1. Server Configuration
server.port=${SERVER_PORT:8081}

# 2. Database Configuration (MySQL)
# Ensure you have created the database 'draftly_db' in MySQL before running!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/draftly_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# 3. Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. AI API Key (Used by AIService)
ai.api.key=${AI_API_KEY:}

# 5. Gmail OAuth2 Properties
# Requirement: Step 1 - Secure OAuth2 Integration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# Added standard scopes for better user profile handling
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/gmail.modify,https://www.googleapis.com/auth/gmail.readonly
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# 6. Logging & Monitoring (Step 6)
logging.level.org.springframework.retry=DEBUG
logging.level.com.draftly=INFO
# Shows the exact SQL queries in the console for your audit log
logging.level.org.hibernate.SQL=DEBUG